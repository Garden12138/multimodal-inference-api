name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Unit tests
        run: python -m pytest
      - name: Compile Python
        run: python -m compileall -q inference app.py
      - name: Shell syntax
        run: |
          bash -n scripts/install.sh
          bash -n scripts/start.sh
          bash -n scripts/status.sh
          bash -n scripts/stop.sh
      - name: Workflow JSON and manifest
        run: |
          python - << 'PY'
          import hashlib
          import json
          from pathlib import Path

          from inference.workflows.manifest import WORKFLOW_SHA256

          if len(WORKFLOW_SHA256) != 5:
              raise SystemExit(f"expected 5 workflows, found {len(WORKFLOW_SHA256)}")
          for relative, digest in WORKFLOW_SHA256.items():
              raw = Path("workflows", relative).read_bytes()
              json.loads(raw)
              actual = hashlib.sha256(raw).hexdigest()
              if actual != digest:
                  raise SystemExit(f"{relative} sha256 {actual} != {digest}")
          print("workflow json and manifest ok")
          PY
